version: 2

project_name: land

builds:
  - main: ./cmd/land
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: SHA256SUMS

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Nightly releases publish under immutable tags like v0.2.0-<sha>-nightly
# (goreleaser v2.16 policy); those tags must not affect version detection.
git:
  ignore_tags:
    - '*-nightly'
    - nightly
