name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: cross-compile
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build ./cmd/land
          done
