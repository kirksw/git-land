name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    name: test, nightly release
    # Scheduled builds run only in the upstream repository, never forks.
    if: github.repository == 'kirksw/git-land'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # Nightlies are goreleaser snapshot builds (goreleaser's --nightly
      # publishing is Pro-only): pin the version to a semver prerelease tag
      # derived from the newest stable tag, then publish it as a prerelease.
      - name: derive nightly version
        run: |
          LAST=$(git tag -l | grep -E '^v[0-9]+(\.[0-9]+){0,2}$' | sort -V | tail -1)
          LAST=${LAST:-v0.0.0}
          MAJOR=$(echo "${LAST#v}" | cut -d. -f1)
          MINOR=$(echo "${LAST#v}" | cut -d. -f2)
          MINOR=${MINOR:-0}
          echo "NIGHTLY_TAG=v${MAJOR}.$((MINOR + 1)).0-nightly.$(date -u +%Y%m%d).$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ env.NIGHTLY_TAG }}
      - name: publish nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$NIGHTLY_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --title "land $NIGHTLY_TAG" \
            --notes "Automated nightly build of main; not a stable release." \
            --prerelease
